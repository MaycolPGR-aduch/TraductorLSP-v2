[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "senasperu"
version = "0.1.0"
description = "Traductor de Lengua de Señas Peruana (LSP) a texto y voz, 100% offline y CPU-only"
readme = "README.md"
# Techo real, no preferencia: mediapipe 0.10.21 (la última con Holistic legacy)
# solo publica wheels hasta cp311 en Windows. Verificado con 'pip download'.
requires-python = ">=3.11,<3.12"
license = { text = "GPL-3.0-or-later" }

# Dependencias de la APLICACIÓN final (sin PyTorch: el entrenamiento vive aparte).
dependencies = [
    # numpy <2: las wheels de MediaPipe 0.10.x están compiladas contra numpy 1.x.
    "numpy>=1.26,<2",
    "opencv-python>=4.9,<5",
    # VERSIÓN FIJA A PROPÓSITO. MediaPipe eliminó las soluciones legacy
    # (`mp.solutions.*`) a partir de la 0.10.30: 0.10.21 es la última que incluye
    # Holistic con sus modelos .tflite empaquetados dentro de la wheel, lo que
    # evita descargas externas y mantiene la app 100 % offline.
    # No subir esta versión sin migrar antes el extractor a la API Tasks
    # (HolisticLandmarker) Y re-extraer el dataset desde los videos de respaldo:
    # el formato de landmarks quedaría distinto al de las grabaciones existentes.
    "mediapipe==0.10.21",
    "PySide6>=6.6,<7",
    "PyYAML>=6.0",
    # Métricas de CPU/RAM en vivo para validar los criterios de aceptación.
    "psutil>=5.9",
]

[project.optional-dependencies]
# Fase 2 — entrenamiento (Colab o local). No se empaqueta con la app.
train = [
    "torch>=2.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "onnx>=1.16",
    # torch.onnx.export usa el exportador basado en dynamo desde PyTorch 2.6,
    # y ese camino requiere onnxscript.
    "onnxscript>=0.1",
    "onnxruntime>=1.17",
]
# Fase 2/3 — inferencia en la app final.
infer = ["onnxruntime>=1.17"]
# Fase 3 — voz offline. sounddevice llega también como dependencia de MediaPipe,
# pero se declara aquí porque la reproducción de audio depende de él de verdad.
tts = ["piper-tts>=1.2", "sounddevice>=0.4.4"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
