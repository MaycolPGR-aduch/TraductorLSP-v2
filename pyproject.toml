[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "senasperu"
version = "0.1.0"
description = "Traductor de Lengua de Señas Peruana (LSP) a texto y voz, 100% offline y CPU-only"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }

# Dependencias de la APLICACIÓN final (sin PyTorch: el entrenamiento vive aparte).
dependencies = [
    # numpy <2: las wheels de MediaPipe 0.10.x están compiladas contra numpy 1.x.
    "numpy>=1.26,<2",
    "opencv-python>=4.9,<5",
    # 0.10.x es la última serie con la solución legacy `mp.solutions.holistic`.
    "mediapipe>=0.10.14,<0.11",
    "PySide6>=6.6,<7",
    "PyYAML>=6.0",
    # Métricas de CPU/RAM en vivo para validar los criterios de aceptación.
    "psutil>=5.9",
]

[project.optional-dependencies]
# Fase 2 — entrenamiento (Colab o local). No se empaqueta con la app.
train = [
    "torch>=2.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "onnx>=1.16",
    "onnxruntime>=1.17",
]
# Fase 2/3 — inferencia en la app final.
infer = ["onnxruntime>=1.17"]
# Fase 3 — voz offline.
tts = ["piper-tts>=1.2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
